# The inference gateway in front of the vLLM workers. `make image` builds the Dockerfile for amd64 and arm64 and
# pushes it; pin the pushed digest on the image line below. The warm-up body comes from the gateway-warmup ConfigMap.
# Cluster-internal only: a ClusterIP Service. Prometheus scrapes its orch_* metrics through the pod annotations.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  replicas: 1                      # the run table and the queue live in memory; a second replica would split them
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false     # the gateway never talks to the Kubernetes API
      terminationGracePeriodSeconds: 130      # lets an in-flight call finish under the client's 120 s timeout
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: gateway
          image: docker.io/cdugga/ariadne-gateway:REPLACE-WITH-DIGEST   # pin the image `make image` pushed, by digest
          imagePullPolicy: IfNotPresent
          env:
            - {name: GW_LISTEN, value: ":8000"}
            - {name: GW_WARM_BODY, value: /etc/gateway/warm.json}
            - {name: GW_POLICY, value: prefix_then_load}     # least_loaded is the control arm of the stickiness A/B
            - {name: GW_POOL, value: sliced}
            # GW_WORKERS defaults to vllm-0 and vllm-1 on the headless vllm Service; an absent vllm-1 is just Down.
            # Overflow to Superlinked (D-53, design/overflow.md): off until the key arrives. The key comes from the
            # gateway-overflow Secret, which does not exist until someone creates it:
            #   kubectl create secret generic gateway-overflow --from-literal=api-key=<key>
            #   kubectl set env deployment/gateway GW_OVERFLOW=true
            # A restricted request never leaves whatever these say; the backend is probed and falls back to the 503.
            - {name: GW_OVERFLOW, value: "false"}
            - {name: GW_OVERFLOW_BASE_URL, value: https://api.superlinked.com}
            - {name: GW_OVERFLOW_MODEL, value: Qwen/Qwen3.8-27B-FP8}   # what their API served on 10-04 (F22); confirm with GET /v1/models
            - {name: GW_OVERFLOW_TIMEOUT, value: 60s}
            - {name: GW_OVERFLOW_PROBE_INTERVAL, value: 30s}
            - {name: GW_OVERFLOW_MAX_INFLIGHT, value: "4"}
            - name: GW_OVERFLOW_API_KEY
              valueFrom:
                secretKeyRef: {name: gateway-overflow, key: api-key, optional: true}   # optional: the pod starts without the Secret
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          readinessProbe:                   # ready once any worker has passed warm-up
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          volumeMounts:
            - {name: warmup, mountPath: /etc/gateway, readOnly: true}
      volumes:
        - name: warmup
          configMap: {name: gateway-warmup}
