[package]
name = "ariadne-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ariadne-decide = { version = "0.1.0", path = "../decide" }
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6", features = ["derive", "env"] }
http = "1.5.0"
prometheus = { version = "0.14.0", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = "0.7.19"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.53.3", features = ["test-util"] }
